<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C74634"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="badgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="1200" height="420" rx="16" fill="url(#bg)"/>

  <!-- Geometric Grid Accent -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Glowing Abstract Circles -->
  <circle cx="1080" cy="120" r="140" fill="#C74634" opacity="0.15" filter="url(#shadow)" />
  <circle cx="1120" cy="280" r="90" fill="#F59E0B" opacity="0.12" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#accent)"/>

  <!-- Oracle Brand Tag -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="190" height="34" rx="17" fill="url(#badgeGlow)" />
    <text x="95" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5" text-anchor="middle">ORACLE CERTIFIED</text>
  </g>

  <!-- Track Tag -->
  <g transform="translate(262, 48)">
    <rect x="0" y="0" width="280" height="34" rx="17" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="140" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Oracle Linux & Systems</text>
  </g>

  <!-- Main Exam Code -->
  <text x="60" y="160" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="1">
    ORACLE 1Z0-106
  </text>

  <!-- Title Subheading -->
  <text x="60" y="210" fill="url(#accent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700">
    Oracle Linux 8 Advanced System Administration
  </text>

  <!-- Meta Info Cards -->
  <g transform="translate(60, 260)">
    <!-- Card 1: Level -->
    <rect x="0" y="0" width="220" height="74" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="20" y="28" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">CREDENTIAL LEVEL</text>
    <text x="20" y="55" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">OCP</text>

    <!-- Card 2: Duration -->
    <rect x="235" y="0" width="160" height="74" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="255" y="28" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">DURATION</text>
    <text x="255" y="55" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">90 Minutes</text>

    <!-- Card 3: Questions -->
    <rect x="410" y="0" width="160" height="74" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="430" y="28" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">FORMAT</text>
    <text x="430" y="55" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">60 Questions</text>

    <!-- Card 4: Passing Score -->
    <rect x="585" y="0" width="160" height="74" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="605" y="28" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">PASS SCORE</text>
    <text x="605" y="55" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">68%</text>

    <!-- Card 5: Practice Engine -->
    <rect x="760" y="0" width="280" height="74" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
    <text x="780" y="28" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">RECOMMENDED PRACTICE</text>
    <text x="780" y="55" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">CertsClub Test Engine</text>
  </g>

  <!-- Bottom Strip -->
  <text x="60" y="385" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    Official Certification Study Guide &amp; Technical Preparation Hub • Organization: Oracle-Certifications
  </text>
</svg>